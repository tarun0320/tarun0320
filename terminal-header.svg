<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mono { font-family: 'Courier New', Courier, monospace; }
    </style>
  </defs>

  <!-- outer rounded border -->
  <rect x="2" y="2" width="996" height="296" rx="14" fill="#0d0d12" stroke="#e0526b" stroke-width="1.5"/>

  <!-- title bar -->
  <rect x="2" y="2" width="996" height="46" rx="14" fill="#111116"/>
  <rect x="2" y="34" width="996" height="14" fill="#111116"/>
  <line x1="2" y1="48" x2="998" y2="48" stroke="#3a2a30" stroke-width="1"/>

  <!-- traffic light dots -->
  <circle cx="32" cy="25" r="7" fill="#ff5f57"/>
  <circle cx="56" cy="25" r="7" fill="#febc2e"/>
  <circle cx="80" cy="25" r="7" fill="#28c840"/>

  <!-- title text -->
  <text x="500" y="30" text-anchor="middle" class="mono" font-size="15" fill="#8b8b93">tarun@kanpur — zsh</text>

  <!-- prompt line 1: whoami -->
  <text x="40" y="100" class="mono" font-size="20" fill="#4fd1a5">→</text>
  <text x="65" y="100" class="mono" font-size="20" fill="#8b8b93">~</text>
  <text x="90" y="100" class="mono" font-size="20" fill="#e0526b">whoami</text>

  <!-- big name -->
  <text x="40" y="175" class="mono" font-size="64" font-weight="bold" fill="#e8546a">TARUN BHADAURIA</text>

  <!-- tagline -->
  <text x="40" y="222" class="mono" font-size="21" fill="#c7c7cf">full-stack · AI/ML · agentic systems · always shipping</text>

  <!-- prompt line 2: blinking cursor -->
  <text x="40" y="270" class="mono" font-size="20" fill="#4fd1a5">→</text>
  <text x="65" y="270" class="mono" font-size="20" fill="#8b8b93">~</text>
  <rect x="90" y="253" width="14" height="22" fill="#e0526b">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
